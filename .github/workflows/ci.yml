name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/BlazeDb.slnx

      - name: Build
        run: dotnet build src/BlazeDb.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/BlazeDb.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack src/BlazeDb.slnx --no-build --configuration Release --output artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
