<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazeDb - a memory-first database for the browser</title>
    <meta name="description" content="Interactive showcase of BlazeDb: a SQL-free, memory-first embedded database engine for .NET and Blazor WebAssembly with OPFS-backed durability." />
    <meta name="theme-color" content="#08090d" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        // Applied before first paint so the theme never flashes.
        (function () {
            try {
                var saved = localStorage.getItem('blazedb-theme');
                var dark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) { /* storage blocked - keep the default */ }
        })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="mask-icon" href="favicon.svg" color="#f2610c" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5Z" />
                </svg>
            </div>
            <div class="boot-name">BlazeDb</div>
            <div class="boot-track"></div>
            <div class="boot-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
